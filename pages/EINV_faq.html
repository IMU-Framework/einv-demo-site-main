<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.min.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/override_common.css">
    <link rel="stylesheet" href="css/override_standard.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-1062227694"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-1062227694');
    </script>

    <title>常見問題 - 群豐電子發票服務</title>
</head>
<body>

    <div id="page-loader" aria-hidden="true">
      <div class="page-loader__spinner"></div>
    </div>

    <div id="included_navbar" style="height: 80px;"></div>

    <!-- 頁面大標題 -->
    <section class="pt-5 pb-4">
      <div class="container text-center">
        <div id="page-title-faq"></div>
      </div>
    </section>

    <!-- 類別 Pill 按鈕 + 搜尋列 -->
    <section class="py-3" style="background-color: #ffffff; border-bottom: 1px solid #dee2e6;">
      <div class="container">
        <div class="d-flex flex-wrap align-items-center gap-2">
          <div id="faq-category-tiles" class="d-flex flex-wrap gap-2 flex-grow-1"></div>
          <div class="input-group flex-shrink-0" style="min-width: 180px; max-width: 260px;">
            <span class="input-group-text faq-search-prepend">
              <i class="bi bi-search small"></i>
            </span>
            <input type="search"
                   id="faq-search"
                   class="form-control faq-search-input"
                   placeholder="搜尋問題…"
                   autocomplete="off">
          </div>
        </div>
      </div>
    </section>

    <!-- Section 1: 電子發票法規參考連結（靜態外部連結，不納入知識庫） -->
    <section class="py-5">
      <div class="container">
        <h3 class="section-heading">電子發票法規參考連結</h3>
        <ul class="ext-link-list mt-4">
          <li>
            <i class="bi bi-box-arrow-up-right"></i>
            <a href="https://www.mohw.gov.tw/lp-3923-1.html" target="_blank" rel="noopener noreferrer">
              相關問題Q&amp;A - 衛生福利部
            </a>
          </li>
          <li>
            <i class="bi bi-box-arrow-up-right"></i>
            <a href="https://inv.iotnet.com.tw/problem.php" target="_blank" rel="noopener noreferrer">
              電子發票絕佳選擇 提供多樣化一條龍服務 | 盟立電子發票加值中心
            </a>
          </li>
        </ul>
      </div>
    </section>

    <!-- 動態 FAQ 各類別 Accordion（由 renderFaqSections 填入） -->
    <div id="faq-sections-container"></div>

    <div id="included_footer"></div>

    <a href="javascript:void(0)" class="scroll-top-btn" aria-label="回到頂端">
      <i class="bi bi-arrow-up"></i>
    </a>

    <script src="jquery/dist/jquery.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="js/data-solution.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/components.js"></script>
    <script src="js/data-faq.js"></script>
    <script>
      $(function(){
var _loaderTimer = setTimeout(hidePageLoader, 1500);
        $('#included_navbar').load('template/navbar.html', function() {
          clearTimeout(_loaderTimer);
          hidePageLoader();
          if (typeof initNavbar === 'function') initNavbar();
        });
        $('#included_footer').load('template/footer.html', function() {
          if (typeof initFooter === 'function') initFooter();
        });

        renderSectionTitle('page-title-faq', {
          title: '常見問題 FAQ',
          decorated: true
        });

        renderFaqCategories('faq-category-tiles', faqCategories);
        renderFaqSections('faq-sections-container', faqCategories, faqData);

        /* ── 類別 Pill 平滑捲動 ──────────────────────────── */
        $(document).on('click', '.faq-category-btn', function(e) {
          e.preventDefault();
          var $target = $($(this).data('faq-target'));
          if ($target.length) {
            $('html, body').animate({ scrollTop: $target.offset().top - 80 }, 400);
          }
        });

        /* ── 關鍵字搜尋（Substring 比對） ────────────────── */
        $('#faq-search').on('input', function() {
          var q = $.trim($(this).val()).toLowerCase();
          if (!q) {
            $('.accordion-item').show();
            $('.faq-section').show();
            return;
          }
          $('.faq-section').each(function() {
            var $sec = $(this);
            var hasVisible = false;
            $sec.find('.accordion-item').each(function() {
              var titleMatch = ($(this).data('faq-title') || '').toLowerCase().indexOf(q) !== -1;
              var bodyMatch  = ($(this).data('faq-body')  || '').toLowerCase().indexOf(q) !== -1;
              var match = titleMatch || bodyMatch;
              $(this).toggle(match);
              if (match) hasVisible = true;
            });
            $sec.toggle(hasVisible);
          });
        });
      });
    </script>

</body>
</html>
