<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.min.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/override_common.css">
    <link rel="stylesheet" href="css/solution-cards.css">
    <link rel="stylesheet" href="css/case-cards.css">
    <link rel="stylesheet" href="css/override_standard.css">
    <link rel="stylesheet" href="css/article-page.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-1062227694"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-1062227694');
    </script>

    <title>成功案例 - 群豐電子發票服務</title>
</head>
<body>

    <div id="page-loader" aria-hidden="true">
      <div class="page-loader__spinner"></div>
    </div>

    <div id="included_navbar" style="height: 80px;"></div>

    <!-- 頁面大標題 -->
    <section class="pt-5 pb-4">
      <div class="container text-center">
        <div id="page-title-case"></div>
      </div>
    </section>

    <!-- 案例卡片輪播 -->
    <section class="py-5" style="background-color: #ffffff;">
      <div class="container-lg px-4">
        <div id="case-cards" class="case-card-carousel"></div>
      </div>
    </section>

    <!-- 案例詳情覆蓋層 -->
    <div id="article-modal-overlay" class="article-modal-overlay">
      <button type="button" class="article-modal-close" id="article-modal-close-btn" aria-label="關閉">
        <i class="bi bi-x-lg"></i>
      </button>
      <div id="article-modal-content" class="article-modal-content"></div>
    </div>

    <div id="included_footer"></div>

    <a href="javascript:void(0)" class="scroll-top-btn" aria-label="回到頂端">
      <i class="bi bi-arrow-up"></i>
    </a>

    <script src="jquery/dist/jquery.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="js/data-case.js"></script>
    <script src="js/data-solution.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/components.js"></script>
    <script>
      $(function(){
var _loaderTimer = setTimeout(hidePageLoader, 1500);
        $('#included_navbar').load('template/navbar.html', function() {
          clearTimeout(_loaderTimer);
          hidePageLoader();
          if (typeof initNavbar === 'function') initNavbar();
        });
        $('#included_footer').load('template/footer.html');

        renderSectionTitle('page-title-case', {
          title: '成功案例見證',
          description: '成功案例副標題，點擊卡片看案例故事',
          decorated: true
        });

        var $carousel = $('#case-cards');

        caseData.forEach(function(item) {
          var sol = (solutionData || []).filter(function(s){ return s.link === item.solutionLink && s.color; })[0];
          var solTagStyle = sol ? ' style="--_solution-color:' + sol.color + (sol.colorRgb ? ';--_solution-color-rgb:' + sol.colorRgb : '') + '"' : '';
          var cardHtml =
            '<a href="' + item.link + '" class="case-card text-decoration-none">' +
              '<div class="case-card__image">' +
                '<img src="' + item.img + '" alt="' + item.title + '" loading="lazy">' +
                '<div class="case-card__tags">' +
                  '<span class="case-card__tag case-card__tag--industry">' + item.industry + '</span>' +
                  '<span class="case-card__tag case-card__tag--solution"' + solTagStyle + '>' + item.solution + '</span>' +
                '</div>' +
              '</div>' +
              '<div class="case-card__body">' +
                '<div class="case-card__title">' + item.title + '</div>' +
                '<p class="case-card__desc">' + item.desc + '</p>' +
              '</div>' +
            '</a>';
          $carousel.append('<div>' + cardHtml + '</div>');
        });

        $carousel.slick({
          slidesToShow: 4,
          slidesToScroll: 1,
          autoplay: false,
          dots: true,
          arrows: true,
          infinite: false,
          responsive: [
            { breakpoint: 1200, settings: { slidesToShow: 3 } },
            { breakpoint: 768,  settings: { slidesToShow: 2 } },
            { breakpoint: 576,  settings: { slidesToShow: 1, centerMode: true, centerPadding: '36px' } }
          ]
        });

        // ---- 案例詳情覆蓋層邏輯 ----

        var $overlay = $('#article-modal-overlay');
        var $content = $('#article-modal-content');

        function openCaseModal(url) {
          $content.html('<div class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">載入中...</span></div></div>');
          $overlay.addClass('is-open');
          $('body').addClass('overflow-hidden');
          $overlay.scrollTop(0);
          $content.load(url + ' #case-detail-content', function() {
            var caseId = $content.find('[data-case-id]').data('case-id');
            var item = (caseData || []).filter(function(c){ return c.id === caseId; })[0];
            if (item) renderCaseDetail(item);
          });
        }

        function closeCaseModal() {
          $overlay.removeClass('is-open');
          $('body').removeClass('overflow-hidden');
          setTimeout(function() { $content.empty(); }, 300);
        }

        $carousel.on('click', 'a.case-card', function(e) {
          if (window.innerWidth < 576) return;
          e.preventDefault();
          var url = $(this).attr('href');
          if (url) openCaseModal(url);
        });

        $('#article-modal-close-btn').on('click', closeCaseModal);

        $(document).on('keydown', function(e) {
          if (e.key === 'Escape' && $overlay.hasClass('is-open')) closeCaseModal();
        });
      });
    </script>

</body>
</html>
