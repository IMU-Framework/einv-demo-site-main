<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@100;300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/main.min.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/override_common.css">
    <link rel="stylesheet" href="css/solution-cards.css">
    <link rel="stylesheet" href="css/case-cards.css">
    <link rel="stylesheet" href="css/solution-page.css">
    <link rel="stylesheet" href="css/override_standard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-1062227694"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-1062227694');
    </script>

    <title>解決方案一覽 - 群豐電子發票服務</title>
</head>
<body>

    <div id="page-loader" aria-hidden="true">
      <div class="page-loader__spinner"></div>
    </div>

    <div id="included_navbar" style="height: 80px;"></div>

    <!-- Section 1：頁面標題 -->
    <section class="pt-5 pb-4">
      <div class="container text-center">
        <div id="page-title-solution-overview"></div>
      </div>
    </section>

    <!-- Section 2：角色分流 Wizard -->
    <section class="pb-5">
      <div class="container" style="max-width: 820px;">
        <div id="role-wizard-container"></div>
      </div>
    </section>

    <hr class="pos-divider">

    <!-- Section 3：服務方案總覽（比較卡片） -->
    <section class="py-5" style="background: var(--color-bg-page, #F3F4F9);">
      <div class="container text-center mb-4">
        <div id="section-title-compare"></div>
      </div>
      <div class="container">
        <div id="compare-cards-container"></div>
      </div>
    </section>

    <!-- Section 4：CTA -->
    <section class="cta-strip">
      <div class="container text-center">
        <div id="section-title-cta"></div>
        <a href="#" class="btn btn-lg rounded-pill px-5"
           data-bs-toggle="modal" data-bs-target="#contactform">
          免費諮詢，由專人為您評估
        </a>
      </div>
    </section>

    <div id="included_footer"></div>

    <script src="jquery/dist/jquery.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/components.js"></script>
    <script src="js/data-role.js"></script>
    <script src="js/data-solution.js"></script>
    <script>
      $(function(){
var _loaderTimer = setTimeout(hidePageLoader, 1500);
        $('#included_navbar').load('template/navbar.html', function() {
          clearTimeout(_loaderTimer);
          hidePageLoader();
          if (typeof initNavbar === 'function') initNavbar();
        });
        $('#included_footer').load('template/footer.html');

        /* Section 1：頁面標題 */
        renderSectionTitle('page-title-solution-overview', {
          title      : '您的角色是？',
          description: '選擇您的角色和現況，讓我們為您引導至最適合的服務方案。',
          decorated  : true
        });

        /* Section 2：角色分流 Wizard */
        renderRoleWizard('role-wizard-container', roleData);

        
        /* Section 3：服務方案比較卡片 */
        renderSectionTitle('section-title-compare', {
          title      : '服務方案總覽',
          description: '三種方案各有特色，依您的系統現況與需求選擇最適合的電子發票服務。',
          decorated  : true
        });

        var compareRowLabels = {
          infra   : '基礎建設需求',
          itLevel : 'IT開發門檻',
          target  : '適用對象',
          pricing : '計費模式',
          lottery : '自動中獎通知'
        };
        renderSolutionCompareCards('compare-cards-container', solutionData, compareRowLabels);

        /* Section 4：CTA 標題 */
        renderSectionTitle('section-title-cta', {
          title    : '不確定適合哪一種方案？',
          decorated: true
        });
      });
    </script>

</body>
</html>
